<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101c36">
  <title>Create an Account | Astro Alok Tripathi</title>
  <meta name="description" content="Create a customer account to view your signed-in consultation enquiries.">
  <meta property="og:type" content="website"><meta property="og:title" content="Create an Account | Astro Alok Tripathi">
  <link rel="icon" href="assets/astro-alok-tripathi-logo.png" type="image/png"><link rel="stylesheet" href="assets/styles.css"><script src="assets/site-config.js" defer></script><script src="assets/app.js" defer></script><script src="assets/auth.js" defer></script>
</head>
<body><div data-site-header></div><main>
  <section class="page-hero page-hero-compact"><div class="wrap page-hero-inner"><div class="section-kicker"><span>CREATE AN ACCOUNT</span><span class="kicker-line"></span><span data-en="For consultation clients" data-hi="परामर्श के लिए">परामर्श के लिए</span></div><h1 data-en="Your enquiries,<br><em>in one place.</em>" data-hi="आपके अनुरोध,<br><em>एक जगह।</em>">आपके अनुरोध,<br><em>एक जगह।</em></h1><p data-en="Create a customer account to view enquiries you submit while signed in. Creating an account does not book or confirm a consultation." data-hi="साइन इन रहते हुए भेजे गए अनुरोध देखने के लिए ग्राहक खाता बनाएँ। खाता बनाने से परामर्श बुक या पक्का नहीं होता।">साइन इन रहते हुए भेजे गए अनुरोध देखने के लिए ग्राहक खाता बनाएँ। खाता बनाने से परामर्श बुक या पक्का नहीं होता।</p></div></section>
  <section class="section-pad"><div class="wrap account-narrow"><form class="enquiry-form account-form" id="signup-form" novalidate><div class="form-heading"><span class="form-heading-mark">✳</span><div><h2 data-en="Create your account" data-hi="अपना खाता बनाएँ">अपना खाता बनाएँ</h2><p data-en="Use an email address you control and a strong password." data-hi="अपना ईमेल पता और मजबूत पासवर्ड इस्तेमाल करें।">अपना ईमेल पता और मजबूत पासवर्ड इस्तेमाल करें।</p></div></div><div class="form-grid"><div class="field"><label for="signup-first-name" data-en="First name" data-hi="पहला नाम">पहला नाम</label><input id="signup-first-name" name="firstName" type="text" autocomplete="given-name" required maxlength="80"></div><div class="field"><label for="signup-last-name" data-en="Last name" data-hi="अंतिम नाम">अंतिम नाम</label><input id="signup-last-name" name="lastName" type="text" autocomplete="family-name" required maxlength="80"></div><div class="field field-full"><label for="signup-email" data-en="Email address" data-hi="ईमेल पता">ईमेल पता</label><input id="signup-email" name="email" type="email" autocomplete="email" required maxlength="254"></div><div class="field field-full"><label for="signup-password" data-en="Password (at least 12 characters)" data-hi="पासवर्ड (कम से कम 12 अक्षर)">पासवर्ड (कम से कम 12 अक्षर)</label><input id="signup-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="256"></div><div class="field field-full"><label for="signup-confirm" data-en="Confirm password" data-hi="पासवर्ड की पुष्टि करें">पासवर्ड की पुष्टि करें</label><input id="signup-confirm" name="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="256"></div><div class="field field-full"><label class="consent-label" for="signup-consent"><input id="signup-consent" name="privacyConsent" type="checkbox" required><span data-en="I understand that accounts are not email-verified yet. My email is used as a sign-in name, and password reset is unavailable until email delivery is configured." data-hi="मैं समझता/समझती हूँ कि अभी ईमेल सत्यापन नहीं होता। मेरा ईमेल साइन-इन नाम के रूप में उपयोग होगा और ईमेल सेवा सेट होने तक पासवर्ड रीसेट उपलब्ध नहीं है।">मैं समझता/समझती हूँ कि अभी ईमेल सत्यापन नहीं होता। मेरा ईमेल साइन-इन नाम के रूप में उपयोग होगा और ईमेल सेवा सेट होने तक पासवर्ड रीसेट उपलब्ध नहीं है।</span> <span class="required">*</span></label></div></div><p class="form-error" id="signup-error" role="alert" hidden></p><button class="button button-navy form-submit" type="submit"><span data-en="Create customer account" data-hi="ग्राहक खाता बनाएँ">ग्राहक खाता बनाएँ</span><span aria-hidden="true">↗</span></button><p class="account-switch"><span data-en="Already registered?" data-hi="पहले से खाता है?">पहले से खाता है?</span> <a href="login.html" data-en="Sign in" data-hi="साइन इन करें">साइन इन करें</a></p></form></div></section>
</main><div data-site-footer></div></body>
</html>
