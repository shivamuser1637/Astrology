services:
  - type: web
    name: astro-alok-tripathi
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: astro-alok-tripathi-db
          property: connectionString
      - key: WHATSAPP_NUMBER
        sync: false

databases:
  - name: astro-alok-tripathi-db
    databaseName: astrology
    user: astro_alok_tripathi
    plan: free
